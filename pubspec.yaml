name: gymforge
description: GymForge - Professional Gym Management App
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  provider: ^6.1.2
  fl_chart: ^1.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.2
  cached_network_image: ^3.3.1
  image_picker: ^1.2.2
  pedometer: ^4.2.0
  permission_handler: ^12.0.1
  home_widget: ^0.9.2
  shared_preferences: ^2.5.5
  google_fonts: ^8.1.0
  http: ^1.6.0
  intl: ^0.20.2
  uuid: ^4.4.2
  crypto: ^3.0.3
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/gifs/