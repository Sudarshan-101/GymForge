<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GymForge - professional gym management and member tracking.">

  <!-- ✅ iPhone / iOS Safari viewport — viewport-fit=cover handles the notch/Dynamic Island -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- ✅ PWA / Add to Home Screen on iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- black-translucent lets your Flutter UI draw behind the status bar -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymForge">

  <!-- ✅ Touch icons — iOS uses apple-touch-icon; supply 180px for iPhone retina -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- ✅ Theme colour shown in Safari's tab bar -->
  <meta name="theme-color" content="#0B0B0B">

  <!-- Camera for QR check-in (required by Chrome / Safari getUserMedia) -->
  <meta http-equiv="Permissions-Policy" content="camera=(self)">

  <title>GymForge</title>

  <style>
    /* ── Prevent iOS Safari bounce / overscroll ──────────────────────── */
    html, body {
      height: 100%;
      overflow: hidden;
      /* Respect the safe-area insets on notched iPhones */
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      margin: 0;
      background-color: #0B0B0B;
    }

    /* ── Hide the default loading text Flutter injects ──────────────── */
    body > [id="loading"] { display: none; }

    /* ── Splash shown while Flutter boots ───────────────────────────── */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0B0B0B;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      gap: 16px;
    }
    #splash-logo {
      width: 80px; height: 80px;
      background: #2196F3;
      border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 40px #2196F355;
    }
    #splash-logo svg { width: 44px; height: 44px; }
    #splash h1 {
      color: #2196F3; font-size: 26px; font-weight: 900;
      letter-spacing: 6px; margin: 0;
    }
    #splash p { color: #aaa; font-size: 12px; margin: 0; }
    .spinner {
      width: 24px; height: 24px; margin-top: 8px;
      border: 2px solid #333;
      border-top-color: #2196F3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Native splash shown until Flutter renders its first frame -->
  <div id="splash">
    <div id="splash-logo">
      <!-- dumbbell SVG icon -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="10" width="4" height="4" rx="1" fill="#000"/>
        <rect x="5" y="8" width="3" height="8" rx="1" fill="#000"/>
        <rect x="8" y="11" width="8" height="2" rx="1" fill="#000"/>
        <rect x="16" y="8" width="3" height="8" rx="1" fill="#000"/>
        <rect x="19" y="10" width="4" height="4" rx="1" fill="#000"/>
      </svg>
    </div>
    <h1>GYMFORGE</h1>
    <p>Manage · Track · Grow</p>
    <div class="spinner"></div>
  </div>

  <!-- Flutter bootstrap — this script loads and starts the Flutter engine -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Hide our custom splash once Flutter draws its first frame.
    // Flutter dispatches "flutter-first-frame" on window when ready.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.style.transition = 'opacity 0.4s ease';
        splash.style.opacity = '0';
        setTimeout(function() { splash.remove(); }, 420);
      }
    });
  </script>
</body>
</html>
